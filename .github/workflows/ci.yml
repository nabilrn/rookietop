name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: make CC=${{ matrix.cc }} clean check

      - name: Runtime stress smoke
        if: matrix.cc == 'gcc'
        run: ROOKIETOP_STRESS_SECONDS=12 make stress | tee stress-summary.txt

      - name: Upload runtime stress summary
        if: always() && matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-stress-${{ github.sha }}
          path: stress-summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Sanitizer build and test
        if: matrix.cc == 'gcc'
        run: |
          make clean
          make CC=gcc debug
          ./tests/test_cpu
          ./tests/test_memory
          ./tests/test_disk
          ./tests/test_network
          ./tests/test_process
          ./tests/test_process_cpu
          ./tests/test_process_list
          ./tests/test_process_query
          ./tests/test_teaching
          ./tests/test_diagnosis
          ./tests/test_host
          ./rookietop --help >/dev/null
          ./rookietop --version >/dev/null
          ./rookietop --once >/dev/null
